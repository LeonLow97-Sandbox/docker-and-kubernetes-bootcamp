apiVersion: batch/v1
kind: Job
metadata:
  name: math-add-job
spec:
  completions: 3  # set 3 pods
  parallelism: 3  # to create 3 pods in parallel
  template:
    spec:   # pod spec
      containers:
        - name: math-add
          image: ubuntu
          command: ['expr', '3', '+', '2']
      restartPolicy: Never
