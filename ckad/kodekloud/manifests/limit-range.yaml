# LimitRange does not affect existing pods, only new pods are affected.

# CPU
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-resource-constraint
spec:
  limits:
  - default:        # Limit
      cpu: 500m
    defaultRequest: # Request
      cpu: 500m
    max:            # Limit
      cpu: "1"
    min:            # Request
      cpu: 100m
    type: Container

---

# Memory
apiVersion: v1
kind: LimitRange
metadata:
  name: memory-resource-constraint
spec:
  limits:
  - default:
      memory: 1Gi
    defaultRequest:
      memory: 1Gi
    max:
      memory: 1Gi
    min:
      memory: 500Mi
    type: Container
