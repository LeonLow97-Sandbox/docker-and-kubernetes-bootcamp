apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: app-container
          image: nginx:1.24
          ports:
            - containerPort: 80
